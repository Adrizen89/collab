# Lance la base de données + les deux serveurs (API & Realtime).
# Le front Vite se lance à part en dev : `npm run dev:web`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      API_PORT: ${API_PORT}
      WEB_ORIGIN: ${WEB_ORIGIN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
    ports:
      - "${API_PORT}:${API_PORT}"

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      REALTIME_PORT: ${REALTIME_PORT}
      API_INTERNAL_URL: "http://api:${API_PORT}"
    ports:
      - "${REALTIME_PORT}:${REALTIME_PORT}"

volumes:
  pgdata:
